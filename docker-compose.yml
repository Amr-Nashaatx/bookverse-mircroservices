services:
    postgres:
        image: postgres:16-alpine
        restart: always
        container_name: postgres
        env_file:
            - ./.env.dev
        environment:
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - bookverse
    rabbitmq:
        image: rabbitmq:3-management
        restart: always
        container_name: rabbitmq
        env_file:
            - ./.env.dev
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        ports:
            - '5672:5672'
            - '15672:15672'
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - bookverse
    redis:
        image: redis:7-alpine
        restart: always
        container_name: redis
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - bookverse
    auth-service:
        build:
            context: .
            dockerfile: packages/services/auth-service/Dockerfile
        restart: always
        container_name: auth-service
        env_file:
            - ./.env.dev
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            PORT: 3001
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3001/health']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - bookverse
    book-service:
        build:
            context: .
            dockerfile: packages/services/book-service/Dockerfile
        restart: always
        container_name: book-service
        env_file:
            - ./.env.dev
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            PORT: 3002
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3002/health']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - bookverse
    review-service:
        build:
            context: .
            dockerfile: packages/services/review-service/Dockerfile
        restart: always
        container_name: review-service
        env_file:
            - ./.env.dev
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            PORT: 3003
            BOOK_SERVICE_URL: http://book-service:3002/books
            # Soft dependency by default. Set to "true" to make book-service a
            # hard dependency and measure the cost (Build 3).
            REVIEW_VERIFY_BOOK_EXISTS: ${REVIEW_VERIFY_BOOK_EXISTS:-false}
        depends_on:
            postgres:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3003/health']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - bookverse
    gateway:
        build:
            context: .
            dockerfile: packages/gateway/Dockerfile
        restart: always
        container_name: gateway
        env_file:
            - ./.env.dev
        environment:
            NODE_ENV: ${NODE_ENV:-development}
            PORT: 3000
            AUTH_SERVICE_URL: http://auth-service:3001/auth
            BOOK_SERVICE_URL: http://book-service:3002/books
            REVIEW_SERVICE_URL: http://review-service:3003/reviews
        ports:
            - '3000:3000'
        depends_on:
            auth-service:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/health']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - bookverse

volumes:
    postgres_data:
    rabbitmq_data:
    redis_data:

networks:
    bookverse:
        driver: bridge
